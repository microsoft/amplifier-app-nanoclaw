# NanoClaw with amplifier-agent as the agent backend.
#
# Launches a NanoClaw environment in an Incus container, configured to run
# amplifier-agent (Microsoft's modular agent runtime) as the agent backend.
# The internal provider that amplifier-agent talks to is parameterized by
# the INTERNAL_PROVIDER launch variable.
#
# The profile drives nanoclaw setup non-interactively by calling each
# setup step directly (`pnpm exec tsx setup/index.ts --step <name>`)
# rather than going through `bash nanoclaw.sh`. The interactive prompts
# in nanoclaw.sh and `setup/auto.ts` all live in the orchestration layer;
# the individual step runners under `setup/<name>.ts` are themselves
# prompt-free and accept all required input via CLI args.
#
# Variables (provided at launch via --var):
#   INTERNAL_PROVIDER   one of: anthropic | openai | azure-openai | ollama
#                       (REQUIRED — the model backend amplifier-agent uses)
#   NANOCLAW_REPO       nanoclaw git URL to clone (optional; defaults to
#                       https://github.com/nanocoai/nanoclaw.git)
#   NANOCLAW_REF        nanoclaw git ref (branch/tag/SHA) to clone
#                       (optional; defaults to main)
#
# Passthrough credentials (forwarded from host env when present):
#   ANTHROPIC_API_KEY            always forwarded (used when
#                                INTERNAL_PROVIDER=anthropic)
#   OPENAI_API_KEY               required when INTERNAL_PROVIDER=openai
#   AZURE_OPENAI_API_KEY         required when INTERNAL_PROVIDER=azure-openai
#   AZURE_OPENAI_ENDPOINT        required when INTERNAL_PROVIDER=azure-openai
#   AZURE_OPENAI_API_VERSION     optional; written to .env if set on host
#   OLLAMA_BASE_URL              optional; defaults to http://localhost:11434
#                                inside the DTU (which won't work — point at
#                                a reachable Ollama instance via host env)
#
# Launch examples:
#
#   # amplifier-agent with Anthropic backend
#   amplifier-digital-twin launch nanoclaw-amplifier-agent \
#     --var INTERNAL_PROVIDER=anthropic
#
#   # amplifier-agent with OpenAI backend
#   amplifier-digital-twin launch nanoclaw-amplifier-agent \
#     --var INTERNAL_PROVIDER=openai
#
# After launch:
#
#   amplifier-digital-twin exec --visual-id "" <id>     # interactive shell
#   amplifier-digital-twin destroy <id>                 # clean up
#
# Inside the DTU, the nanoclaw service runs in the background; chat from
# the terminal via `pnpm run chat hi` (from /root/nanoclaw) once the
# readiness check passes.

name: nanoclaw-amplifier-agent
description: >
  NanoClaw configured with amplifier-agent as the agent backend.
  Internal provider is parameterized via --var INTERNAL_PROVIDER.

base:
  image: ubuntu:24.04
  config:
    # security.nesting=true is applied by default to every DTU launch,
    # but we set it explicitly here for clarity since this profile depends
    # on Docker-in-Incus (nanoclaw's agent runtime is itself a Docker
    # container managed by the host-side service).
    security.nesting: "true"
    # nanoclaw service + dockerd + the docker build (which compiles
    # native modules and runs `bun install` for ~250 packages) needs
    # more than the 2 GB default. 16 GiB gives headroom; the docker
    # build's `bun install` OOMs (exit 137) at 8 GiB on busy hosts.
    # macOS Incus (Lima-backed) may cap below this if the host VM is
    # sized small — see the memory-info step in setup_cmds and the
    # Known Issues block at the top of this file.
    limits.memory: "16GiB"
    limits.cpu: "8"

passthrough:
  allow_external: true
  services:
    # Anthropic key is always forwarded — used directly by amplifier-agent
    # when INTERNAL_PROVIDER=anthropic; harmless otherwise.
    - name: anthropic
      key_env: ANTHROPIC_API_KEY
    # Provider-specific keys. The .env writer downstream conditionally
    # picks the right ones based on INTERNAL_PROVIDER, so unused values
    # don't matter.
    - name: openai
      key_env: OPENAI_API_KEY
    - name: azure-openai-key
      key_env: AZURE_OPENAI_API_KEY
    - name: azure-openai-endpoint
      key_env: AZURE_OPENAI_ENDPOINT
    - name: azure-openai-version
      key_env: AZURE_OPENAI_API_VERSION
    - name: ollama
      key_env: OLLAMA_BASE_URL

provision:
  setup_cmds:
    # ── 1. Base tooling ──
    - apt-get update
    - apt-get install -y --no-install-recommends git curl ca-certificates gnupg build-essential

    # ── 2. Node 22 + pnpm ──
    - |
      curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      apt-get install -y --no-install-recommends nodejs
      npm install -g pnpm

    # ── 3. Docker Engine + start dockerd ──
    # nanoclaw spawns its agent runtime as a Docker container, so we
    # need dockerd running inside this Incus container. systemd isn't
    # PID 1 here — we start dockerd manually after install.
    - |
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
        | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      chmod a+r /etc/apt/keyrings/docker.gpg
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu noble stable" \
        > /etc/apt/sources.list.d/docker.list
      apt-get update
      # docker-buildx-plugin is required because nanoclaw's
      # container/Dockerfile uses `RUN --mount=type=cache,...` which
      # needs BuildKit + buildx; the legacy builder fails on those.
      apt-get install -y --no-install-recommends docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

    - |
      mkdir -p /var/log
      # DOCKER_BUILDKIT=1 makes `docker build` use BuildKit by default
      # so the cache-mount RUN steps in nanoclaw's Dockerfile work.
      echo 'export DOCKER_BUILDKIT=1' > /etc/profile.d/docker-buildkit.sh
      export DOCKER_BUILDKIT=1
      dockerd > /var/log/dockerd.log 2>&1 &
      for i in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then echo "docker daemon ready"; break; fi
        sleep 1
      done
      docker version

    # ── 4. Clone nanoclaw ──
    # Lock the clone path to /root/nanoclaw — the Docker image name is
    # sha1(cwd)[:8], so a stable path means a stable image name across
    # launches and update cycles.
    - |
      cd /root
      git clone --depth 1 \
        --branch "${NANOCLAW_REF:-main}" \
        "${NANOCLAW_REPO:-https://github.com/nanocoai/nanoclaw.git}" nanoclaw \
        || git clone --depth 1 \
             "${NANOCLAW_REPO:-https://github.com/nanocoai/nanoclaw.git}" nanoclaw
      cd nanoclaw
      git log -1 --format='nanoclaw HEAD: %H %s'

    # ── 5. Pre-seed .env with the amplifier-agent provider config ──
    # The keys mirror exactly what setup/auto.ts:writeEnvLine emits during
    # an interactive run. amplifier-agent reads them directly at runtime
    # via the agent-runner's env allowlist.
    - |
      cd /root/nanoclaw
      cat > .env <<EOF
      NANOCLAW_DEFAULT_PROVIDER=amplifier-agent
      AMPLIFIER_AGENT_INTERNAL_PROVIDER=${INTERNAL_PROVIDER}
      EOF
      case "${INTERNAL_PROVIDER}" in
        anthropic)
          [ -n "$ANTHROPIC_API_KEY" ] && echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" >> .env
          ;;
        openai)
          [ -n "$OPENAI_API_KEY" ] && echo "OPENAI_API_KEY=$OPENAI_API_KEY" >> .env
          ;;
        azure-openai)
          [ -n "$AZURE_OPENAI_API_KEY" ]     && echo "AZURE_OPENAI_API_KEY=$AZURE_OPENAI_API_KEY"         >> .env
          [ -n "$AZURE_OPENAI_ENDPOINT" ]    && echo "AZURE_OPENAI_ENDPOINT=$AZURE_OPENAI_ENDPOINT"       >> .env
          [ -n "$AZURE_OPENAI_API_VERSION" ] && echo "AZURE_OPENAI_API_VERSION=$AZURE_OPENAI_API_VERSION" >> .env
          ;;
        ollama)
          [ -n "$OLLAMA_BASE_URL" ] && echo "OLLAMA_BASE_URL=$OLLAMA_BASE_URL" >> .env
          ;;
        *)
          echo "ERROR: INTERNAL_PROVIDER must be one of anthropic|openai|azure-openai|ollama, got '${INTERNAL_PROVIDER}'"
          exit 1
          ;;
      esac
      echo "wrote .env:"
      sed 's/=.*KEY=.*$/=<redacted>/' .env

    # ── 6. Install nanoclaw dependencies ──
    - |
      cd /root/nanoclaw
      pnpm install

    # ── 7. Sanity check — what does the container actually have? ──
    # Prints cgroup memory limit + available RAM so OOM failures during
    # docker build (exit 137 at bun install) can be diagnosed by
    # comparing requested vs actual.
    - |
      echo "── container resource snapshot ──"
      cat /proc/meminfo | head -3
      echo "cgroup memory limit:"
      cat /sys/fs/cgroup/memory.max 2>/dev/null || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || echo "(cgroup file not present)"
      echo "nproc: $(nproc)"

    # ── 8. Build the agent container image ──
    # Uses setup/container.ts's step runner which handles the image-name
    # SLUG computation (sha1(cwd)[:8]) automatically. Zero prompts.
    - |
      cd /root/nanoclaw
      pnpm exec tsx setup/index.ts --step container

    # ── 9. Set the mount allowlist (empty — no host filesystem sharing) ──
    - |
      cd /root/nanoclaw
      pnpm exec tsx setup/index.ts --step mounts -- --empty

    # ── 10. Start the nanoclaw service ──
    # We skip the systemd registration (setup/service.ts --step service)
    # and just exec the compiled JS in the background — simpler in a DTU
    # where the container lifecycle is the service lifecycle.
    - |
      cd /root/nanoclaw
      pnpm run build
      mkdir -p logs
      nohup node dist/index.js > logs/nanoclaw.log 2> logs/nanoclaw.error.log &
      echo $! > nanoclaw.pid
      sleep 2

    # ── 11. Wait for both service sockets to appear ──
    # data/cli.sock = inbound message delivery (used by `pnpm run chat`)
    # data/ncl.sock = admin API (used by the `ncl` CLI)
    - |
      cd /root/nanoclaw
      timeout 60 sh -c 'until [ -S data/cli.sock ] && [ -S data/ncl.sock ]; do sleep 1; done' \
        || (echo "ERROR: service sockets did not appear within 60s"; \
            cat logs/nanoclaw.log; cat logs/nanoclaw.error.log; exit 1)
      ls -la data/cli.sock data/ncl.sock

    # ── 12. Register the CLI agent group with amplifier-agent provider ──
    # init-cli-agent.ts writes directly to data/v2.db (SQLite WAL mode,
    # safe alongside the running service). --provider is critical here:
    # NANOCLAW_DEFAULT_PROVIDER in .env is only read by init-first-agent.ts
    # (for DM channels), not by init-cli-agent.ts.
    - |
      cd /root/nanoclaw
      pnpm exec tsx scripts/init-cli-agent.ts \
        --display-name "dtu-user" \
        --agent-name "Terminal Agent" \
        --provider amplifier-agent

    # ── 13. Sanity check ──
    - |
      cd /root/nanoclaw
      echo "nanoclaw process: $(cat nanoclaw.pid)"
      ls -la data/cli.sock data/ncl.sock data/v2.db
      grep -E "^NANOCLAW_DEFAULT_PROVIDER|^AMPLIFIER_AGENT_INTERNAL_PROVIDER" .env

readiness:
  - name: docker-daemon
    command: "docker ps >/dev/null 2>&1"
  - name: nanoclaw-cli-socket
    command: "test -S /root/nanoclaw/data/cli.sock"
  - name: nanoclaw-ncl-socket
    command: "test -S /root/nanoclaw/data/ncl.sock"

update:
  cmds:
    - |
      cd /root/nanoclaw
      git pull --ff-only
      pnpm install --frozen-lockfile || pnpm install
      pnpm run build
      docker info >/dev/null 2>&1 || (dockerd > /var/log/dockerd.log 2>&1 &)
      # Restart the service.
      if [ -f nanoclaw.pid ]; then kill "$(cat nanoclaw.pid)" 2>/dev/null || true; fi
      sleep 1
      nohup node dist/index.js > logs/nanoclaw.log 2> logs/nanoclaw.error.log &
      echo $! > nanoclaw.pid
      timeout 60 sh -c 'until [ -S data/cli.sock ] && [ -S data/ncl.sock ]; do sleep 1; done'
      ls -la data/cli.sock data/ncl.sock
